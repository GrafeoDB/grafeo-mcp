name: Latest grafeo

# Runs the test suite against the newest grafeo release on PyPI, pre-releases
# included, within the range pyproject.toml allows. A failure here means a new
# engine release changed behavior the tools rely on (see
# tests/test_grafeo_contract.py) before the lockfile picks it up.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-sources --upgrade-package grafeo --prerelease allow
      - name: Show the grafeo build under test
        run: uv run --no-sync python -c "import grafeo; print(grafeo.build_info())"
      - run: uv run --no-sync pytest -v
