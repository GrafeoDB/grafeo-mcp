[project]
name = "grafeo-mcp"
version = "0.3.0"
description = "MCP server exposing GrafeoDB graph database to AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
keywords = ["mcp", "graph-database", "grafeo", "ai-agents", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grafeo>=0.6.2,<0.7",
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://grafeo.dev/"
Repository = "https://github.com/GrafeoDB/grafeo-mcp"

[project.optional-dependencies]
cli = ["mcp[cli]>=2.2,<3"]

[project.scripts]
grafeo-mcp = "grafeo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafeo_mcp"]

# An explicit list: hatch reads the project's .gitignore only, so without it a
# local build would also pack files that are ignored elsewhere (such as .claude/).
[tool.hatch.build.targets.sdist]
include = [
    "src/grafeo_mcp",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── Ty ────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

# examples/ run in their own environment (uv run --with "grafeo-datasets[grafeo]"), not the project's.
[tool.ty.src]
exclude = ["examples"]

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=grafeo_mcp --cov-report=term-missing"

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["grafeo_mcp"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── Dependency groups ─────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.15",
    "ty>=0.0.16",
    "prek>=0.3",
    "agent-framework-core>=1.25,<2",
    "agent-framework-foundry>=1.0",  # FoundryChatClient wiring test
    "tenacity>=8",  # agent-framework's MCP tool retries with it
]
